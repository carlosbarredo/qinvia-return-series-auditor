[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "return-series-auditor"
version = "1.1.0"
description = "Audit investment return series and equity curves for data-quality and statistical fragility."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
keywords = [
  "finance",
  "investment",
  "returns",
  "risk-metrics",
  "data-quality",
  "command-line-tool",
]
authors = [
  { name = "Carlos Barredo Lago" }
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/carlosbarredo/return-series-auditor"
Repository = "https://github.com/carlosbarredo/return-series-auditor.git"
Issues = "https://github.com/carlosbarredo/return-series-auditor/issues"

[project.optional-dependencies]
notebook = [
  "ipykernel",
  "matplotlib",
  "nbconvert",
  "pandas",
]
dev = [
  "ruff>=0.9,<1",
]

[project.scripts]
return-audit = "return_series_auditor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
